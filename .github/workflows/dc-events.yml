name: dc-events

# 디시 리프트바운드 갤러리 🎁이벤트 새 글 → 매장 정보 게시판 + 대회 탭 + #매장-소식 디스코드.
# 필요 secrets: ANTHROPIC_API_KEY, DISCORD_WEBHOOK_URL_STORE, SUPABASE_SERVICE_ROLE_KEY
# (Supabase 주소는 공개값이라 아래에 직접 적는다.)

on:
  schedule:
    - cron: "17 */3 * * *" # 3시간마다
  workflow_dispatch: {}

permissions:
  contents: write # data/dc-event-seen.json 커밋

concurrency:
  group: dc-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/dc-event-sync.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ztnritiyzscirnrbxqlc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL_STORE: ${{ secrets.DISCORD_WEBHOOK_URL_STORE }}
      - name: 처리한 글 번호 변경 시 커밋
        run: |
          if [ -n "$(git status --porcelain data/dc-event-seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dc-event-seen.json
            git commit -m "chore(dc-events): update processed post list [skip ci]"
            git pull --rebase origin main
            git push
          fi
