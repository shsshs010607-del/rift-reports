name: sync-prices

# 시세 동기화 — JustTCG → Supabase. 서버 없이 GitHub Actions 로 실행.
# 필요 secrets (repo Settings → Secrets and variables → Actions):
#   JUSTTCG_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

on:
  schedule:
    # 주요 세트 ~1,250장 / 20(무료 페이지 제한) ≈ 63콜/회.
    # 무료 1,000콜/월 → 2일마다 (03:00 UTC). 유료 전환 시 더 자주.
    - cron: "0 3 */2 * *"
  workflow_dispatch: {} # 수동 실행 버튼

permissions:
  contents: write # origins-cards.json 갱신 커밋에 필요

concurrency:
  group: sync-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/sync-prices.ts
        env:
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 박스깡 시뮬레이터(origins-sim.html) 카드 시세 스냅샷 — 위 시세 동기화 결과를 반영.
      # 이 파일은 커밋된 정적 스냅샷이라 여기서 자동으로 갱신하지 않으면 그대로 굳는다.
      - run: node scripts/build-origins-sim-data.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: origins-cards.json 변경 시 커밋
        run: |
          if ! git diff --quiet -- public/origins-cards.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/origins-cards.json
            git commit -m "chore(origins-sim): auto-refresh card price snapshot"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi
